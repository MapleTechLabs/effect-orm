name: Fuzz

# A soak of every fuzz property on every target. `bun run test` runs the same
# properties at their smoke budget on each PR; this runs them at 20×, nightly,
# so a rare counterexample is found here and not by a user. A failure prints
# the replay command and the input to pin (tests/fuzz/README.md).
on:
    schedule:
        - cron: "17 3 * * *"
    workflow_dispatch:
        inputs:
            scale:
                description: "FUZZ_SCALE: multiplies each property's runs"
                default: "20"

permissions:
    contents: read

jobs:
    soak:
        name: Soak / ClickHouse ${{ matrix.clickhouse }}
        runs-on: ubuntu-latest
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                clickhouse: ["26.2.19.43", "26.8.2.7"]
        services:
            clickhouse:
                image: clickhouse/clickhouse-server:${{ matrix.clickhouse }}
                env:
                    CLICKHOUSE_USER: maple
                    CLICKHOUSE_PASSWORD: maple
                    CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
                ports:
                    - 8123:8123
                options: >-
                    --health-cmd "clickhouse-client --user maple --password maple --query 'SELECT 1'"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
              with:
                  persist-credentials: false
            - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
            - run: bun install --frozen-lockfile
            - name: Fuzz every target
              env:
                  EFFECT_ORM_CLICKHOUSE_URL: http://127.0.0.1:8123
                  EFFECT_ORM_CLICKHOUSE_USER: maple
                  EFFECT_ORM_CLICKHOUSE_PASSWORD: maple
                  FUZZ_SCALE: ${{ inputs.scale || '20' }}
                  FUZZ_VERBOSE: "1"
              run: bun run fuzz
